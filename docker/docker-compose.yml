# Local infrastructure — Phase 0 (P0-T13 core + P0-T14 extended).
# Production-shaped: Postgres behind PgBouncer, Redis, Redpanda (Kafka API),
# Elasticsearch, OpenTelemetry Collector + Jaeger.
#
# Usage (from repo root):
#   pnpm compose:up
#   pnpm compose:ps
#   pnpm compose:down
#   pnpm compose:check

name: social-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U social -d social']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - social-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: social-pgbouncer
    environment:
      DB_USER: social
      DB_PASSWORD: social
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: social
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '200'
      DEFAULT_POOL_SIZE: '20'
      AUTH_TYPE: plain
      LISTEN_PORT: '6432'
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pidof pgbouncer']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - social-net

  redis:
    image: redis:7-alpine
    container_name: social-redis
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - social-net

  # Kafka-compatible broker (local stand-in for Apache Kafka)
  redpanda:
    image: redpandadata/redpanda:v24.2.4
    container_name: social-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - '1'
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - '0'
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --default-log-level=warn
    ports:
      # Host clients use 19092; containers use redpanda:9092
      - '19092:19092'
      - '9092:9092'
    healthcheck:
      test:
        ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - social-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: social-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.security.http.ssl.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      cluster.name: social-local
    ports:
      - '9200:9200'
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:9200/_cluster/health | grep -E ''"status":"(green|yellow)"'' || exit 1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - social-net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: social-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      # UI
      - '16686:16686'
      # OTLP gRPC (collector forwards here)
      - '4317:4317'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:16686/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - social-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: social-otel-collector
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # App OTLP HTTP (matches OTEL_EXPORTER_OTLP_ENDPOINT default :4318)
      - '4318:4318'
      # Keep host 4317 free for Jaeger; apps inside network can use collector:4317
      - '4319:4317'
    depends_on:
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:13133/ || exit 0']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - social-net

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:

networks:
  social-net:
    driver: bridge
