# Main CI: lint, typecheck, unit tests, build.
# Heavy integration / docker / smoke stay local (or workflow_dispatch).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Hello service e2e
        run: pnpm --filter @social/hello-service test:e2e

      - name: Route inventory + OpenAPI export
        run: |
          pnpm routes:list > /tmp/routes.txt
          node scripts/export-openapi.mjs --out=openapi.generated.json
          test -s openapi.generated.json
          head -5 /tmp/routes.txt
