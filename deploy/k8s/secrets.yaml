# Sensitive configuration. Do NOT commit real production values.
# Prefer ExternalSecrets / SealedSecrets / cloud secret manager in prod.
#
# Create/override at apply time:
#   kubectl -n social create secret generic social-secrets \
#     --from-literal=DATABASE_URL='postgres://…' \
#     --from-literal=REDIS_URL='redis://…' \
#     --from-literal=REALTIME_SERVICE_TOKEN='…' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: social-secrets
  namespace: social
type: Opaque
stringData:
  # Full DSNs with credentials
  DATABASE_URL: postgres://social:social@pgbouncer.social.svc.cluster.local:6432/social
  REDIS_URL: redis://redis.social.svc.cluster.local:6379
  REALTIME_SERVICE_TOKEN: change-me-in-production
