# LOCAL / DEV ONLY — included by overlays/dev.
# Production: use ExternalSecret (deploy/k8s/external-secrets/) or:
#   kubectl -n social create secret generic social-secrets \
#     --from-literal=DATABASE_URL='postgres://…' \
#     --from-literal=REDIS_URL='redis://…' \
#     --from-literal=REALTIME_SERVICE_TOKEN='…'
apiVersion: v1
kind: Secret
metadata:
  name: social-secrets
  namespace: social
  labels:
    app.kubernetes.io/component: secrets
    environment: dev
type: Opaque
stringData:
  DATABASE_URL: postgres://social:social@pgbouncer.social.svc.cluster.local:6432/social
  REDIS_URL: redis://redis.social.svc.cluster.local:6379
  REALTIME_SERVICE_TOKEN: local-dev-realtime-token
