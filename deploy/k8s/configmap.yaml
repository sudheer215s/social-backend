apiVersion: v1
kind: ConfigMap
metadata:
  name: social-config
  namespace: social
data:
  NODE_ENV: production
  LOG_LEVEL: info
  JWT_AUDIENCE: api
  # Cluster-internal service DNS (adjust for your mesh/ingress)
  JWT_ISSUER: http://identity-service.social.svc.cluster.local:3001
  IDENTITY_JWKS_URL: http://identity-service.social.svc.cluster.local:3001/.well-known/jwks.json
  IDENTITY_BASE_URL: http://identity-service.social.svc.cluster.local:3001
  IDENTITY_GRPC_URL: identity-service.social.svc.cluster.local:50051
  POST_BASE_URL: http://post-service.social.svc.cluster.local:3002
  GRAPH_BASE_URL: http://graph-service.social.svc.cluster.local:3003
  TIMELINE_BASE_URL: http://timeline-service.social.svc.cluster.local:3004
  NOTIFICATION_BASE_URL: http://notification-service.social.svc.cluster.local:3005
  SEARCH_BASE_URL: http://search-service.social.svc.cluster.local:3006
  REALTIME_BASE_URL: http://realtime-gateway.social.svc.cluster.local:3007
  # Infrastructure endpoints — replace with managed services / in-cluster operators
  DATABASE_URL: postgres://social:social@pgbouncer.social.svc.cluster.local:6432/social
  DATABASE_POOL_MAX: '5'
  REDIS_URL: redis://redis.social.svc.cluster.local:6379
  KAFKA_BROKERS: redpanda.social.svc.cluster.local:9092
  ELASTICSEARCH_URL: http://elasticsearch.social.svc.cluster.local:9200
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.social.svc.cluster.local:4318
  REALTIME_SERVICE_TOKEN: change-me
