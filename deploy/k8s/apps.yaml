# Minimal Deployments + Services for Nest apps.
# Images: build/push with your registry, e.g. ghcr.io/org/social-identity:tag
# Apply: kubectl apply -f deploy/k8s/
#
# Probes use /health/live (liveness) and /health/ready (readiness → 503 when unavailable).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: social
  labels: { app: identity-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: identity-service }
  template:
    metadata:
      labels: { app: identity-service }
    spec:
      containers:
        - name: app
          image: social-identity:local
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3001 }
            - { name: grpc, containerPort: 50051 }
          env:
            - { name: SERVICE_NAME, value: identity-service }
            - { name: PORT, value: '3001' }
            - { name: IDENTITY_GRPC_URL, value: '0.0.0.0:50051' }
          envFrom:
            - configMapRef: { name: social-config }
            - secretRef: { name: social-secrets }
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: '1', memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: social
spec:
  selector: { app: identity-service }
  ports:
    - { name: http, port: 3001, targetPort: http }
    - { name: grpc, port: 50051, targetPort: grpc }
