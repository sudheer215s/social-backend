# Requires External Secrets Operator:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#
# This is a template — pick ONE provider block and delete the others.
# Auth (IRSA / Workload Identity / static keys) is environment-specific.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: social-secret-store
spec:
  provider:
    # --- AWS Secrets Manager (example) ---
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
    # --- GCP Secret Manager (example; comment aws above and uncomment) ---
    # gcpsm:
    #   projectID: my-gcp-project
    #   auth:
    #     workloadIdentity:
    #       clusterLocation: us-central1
    #       clusterName: social-prod
    #       serviceAccountRef:
    #         name: external-secrets
    #         namespace: external-secrets
    # --- HashiCorp Vault (example) ---
    # vault:
    #   server: https://vault.example.com
    #   path: secret
    #   version: v2
    #   auth:
    #     kubernetesAuth:
    #       path: kubernetes
    #       mountPath: /v1/auth/kubernetes
