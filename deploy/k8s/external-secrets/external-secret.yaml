# Syncs remote secret material into Kubernetes Secret social-secrets.
# Remote key names are conventions — map them to your store paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-secrets
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: social-secret-store
    kind: ClusterSecretStore
  target:
    name: social-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: social-backend
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: social/prod/database-url
        # property: optional if remote secret is JSON
    - secretKey: REDIS_URL
      remoteRef:
        key: social/prod/redis-url
    - secretKey: REALTIME_SERVICE_TOKEN
      remoteRef:
        key: social/prod/realtime-service-token
