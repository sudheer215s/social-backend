# Syncs remote secret material into Kubernetes Secret social-secrets.
# Remote key names are conventions — map them to your store paths.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: social-secrets
  namespace: social
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: social-secret-store
    kind: ClusterSecretStore
  target:
    name: social-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: social-backend
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: social/prod/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: social/prod/redis-url
    - secretKey: REALTIME_SERVICE_TOKEN
      remoteRef:
        key: social/prod/realtime-service-token
    # Optional — only if you put ES/Kafka credentials in the remote store.
    # Uncomment and ensure apps consume them (or drop if unused).
    # - secretKey: ELASTICSEARCH_PASSWORD
    #   remoteRef:
    #     key: social/prod/elasticsearch-password
    # - secretKey: KAFKA_SASL_PASSWORD
    #   remoteRef:
    #     key: social/prod/kafka-sasl-password
